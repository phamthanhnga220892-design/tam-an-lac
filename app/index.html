<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Thập Trai Thanh Tịnh</title>
  <meta name="description" content="Lịch âm và nhắc ngày ăn chay Thập Trai" />
  <meta name="theme-color" content="#faf8ff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Thập Trai" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <img src="assets/buddha.jpg" alt="" />
    <div class="bg-fade"></div>
    <div class="bg-glow"></div>
  </div>

  <header class="app-bar">
    <div class="app-bar__inner">
      <div class="brand">
        <div class="brand__logo"><span class="ms fill">water_drop</span></div>
        <div class="brand__text">
          <span class="brand__name">Thập Trai Thanh Tịnh</span>
          <span class="brand__sub" id="page-title">Hôm Nay</span>
        </div>
      </div>
      <button class="icon-btn icon-btn--solid" id="btn-today" aria-label="Về hôm nay"><span class="ms">today</span></button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tab-bar" aria-label="Điều hướng">
    <div class="tab-bar__inner">
      <a href="#/hom-nay" data-route="hom-nay"><span class="ms">spa</span><span>Hôm nay</span></a>
      <a href="#/lich" data-route="lich"><span class="ms">calendar_month</span><span>Lịch âm</span></a>
      <a href="#/su-kien" data-route="su-kien"><span class="ms">notifications_active</span><span>Sự kiện</span></a>
      <a href="#/cai-dat" data-route="cai-dat"><span class="ms">tune</span><span>Cài đặt</span></a>
    </div>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
